<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CV Deck preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f1efe8; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; color: #2c2c2a; }
    #pdf { border: 0; width: 100%; height: 100%; display: block; }
    #docx { box-sizing: border-box; min-height: 100%; background: #fff; margin: 0 auto; padding: 32px 36px; max-width: 640px; }
    #docx img { max-width: 100%; }
    #docx table { border-collapse: collapse; }
    #docx td, #docx th { border: 1px solid #d3d1c7; padding: 4px 6px; }
    .msg { display: grid; place-items: center; height: 100%; color: #5f5e5a; }
  </style>
</head>
<body>
  <script src="lib.js"></script>
  <script src="vendor/mammoth.browser.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
